<!doctype html>
<html lang="en" data-motion="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121110" />
    <meta
      name="description"
      content="A personal music-discovery app: one record at a time, drawn at random from the Internet Archive and Wikimedia Commons, no genres or recommendations."
    />
    <!-- Early beta: keep it out of search results -->
    <meta name="robots" content="noindex" />
    <!-- "dev" in source; tools/stamp.mjs writes the real version at deploy so main.js can bust the map cache -->
    <meta name="ia-map-version" content="dev" />
    <!-- The first draw talks to these hosts within a second or two; open the connections during page load -->
    <link rel="preconnect" href="https://archive.org" crossorigin />
    <link rel="preconnect" href="https://commons.wikimedia.org" crossorigin />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <!-- Home-screen install: the manifest serves Android and desktop, the apple-* tags serve iOS Safari.
         "black" keeps the status bar outside the page, so no view needs to account for it. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Unmarked" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Unmarked: a record you did not choose</title>
    <link rel="preload" href="./assets/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/motion.css" />
    <script>
      // Dev aid: surfaces load-time errors in the DOM so headless runs can read them
      ;(function () {
        var root = document.documentElement
        function note(message) {
          root.dataset.errors = (root.dataset.errors || '') + message + ' | '
        }
        addEventListener('error', function (e) {
          note(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno)
        })
        addEventListener('unhandledrejection', function (e) {
          note('promise: ' + ((e.reason && e.reason.message) || e.reason))
        })
      })()
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the record</a>
    <div id="app" class="app"></div>
    <noscript><p style="padding: 2rem; font-family: serif">Unmarked needs JavaScript to draw a record.</p></noscript>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
