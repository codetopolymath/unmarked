name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The deploy step builds dist/; fail here, not at deploy time, if it ever stops working
      - run: npm run build
      # Never fails: an old map becomes a visible warning on the run instead
      - run: npm run check:map
      # Broken links or anchors in docs/ fail here, not at deploy time
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict -d "$RUNNER_TEMP/docs-site"
        env:
          NO_MKDOCS_2_WARNING: '1'
